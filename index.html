<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Schedule - Court Case & Soccer Training</title>
  <style>
    /* 1. TABLE SELECTOR: Center table, add border collapse, shadow, and font styling */
    table {
      width: 80%;
      margin: 40px auto;
      border-collapse: collapse;
      font-family: Arial, sans-serif;
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
      background-color: #ffffff;
    }

    /* 2. TABLE HEADERS (th): Style header background, text color, alignment, and padding */
    th {
      background-color: #1e3a8a;
      color: #ffffff;
      padding: 14px;
      text-align: left;
      font-size: 1.1rem;
      text-transform: uppercase;
      letter-spacing: 0.8px;
    }

    /* 3. ALL TABLE CELLS (td): Apply consistent padding and borders to every cell */
    td {
      padding: 12px 16px;
      border-bottom: 1px solid #e5e7eb;
      color: #333333;
    }

    /* 4. AT LEAST ONE COLUMN: Use class selector on time column for bold, custom color styling */
    .time-col {
      width: 25%;
      font-weight: bold;
      color: #1d4ed8;
      background-color: #f8fafc;
    }

    /* 5. AT LEAST ONE ROW: Use ID selector to highlight the key priority event of the day */
    #priority-event {
      background-color: #fef08a;
      font-weight: bold;
    }

    /* Optional row hover effect for clean visual feedback */
    tr:hover {
      background-color: #f1f5f9;
    }
  </style>
</head>
